name: Test and Deploy
on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run automatically at 8AM PST Monday-Friday
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-x64
    if: github.repository_owner == 'sendgrid'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout smtpapi-csharp
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '3.1.x'

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@e22fa7d16d9cfd4f046cb00f471301f5e0a9c546 # v1
        with:
          ecosystem: dotnet

      - name: Build & Test
        run: make install test
        env:
          FrameworkPathOverride: /usr/lib/mono/4.5/

  deploy:
    name: Deploy
    if: success() && github.ref_type == 'tag' && github.repository_owner == 'sendgrid'
    needs: [ test ]
    runs-on: ubuntu-x64
    environment:
      name: production
      url: https://www.nuget.org/packages/SendGrid.SmtpApi/${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout smtpapi-csharp
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The release action verifies refs/tags/<tag> in the local clone.
          fetch-depth: 0

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '3.1.x'

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@e22fa7d16d9cfd4f046cb00f471301f5e0a9c546 # v1
        with:
          ecosystem: dotnet

      - name: Create GitHub Release
        uses: twilio/sdk-actions/github-release@9b1c3222c9ffe38aadedb11c5b9f5a172b5e9951 # v1
        with:
          changelog-file: CHANGELOG.md
          footer: '**[NuGet](https://www.nuget.org/packages/SendGrid.SmtpApi/${{ github.ref_name }})**'

      - name: Publish package to NuGet
        run: |
          make install release
          dotnet nuget push **/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
        env:
          FrameworkPathOverride: /usr/lib/mono/4.5/

#      - name: Submit metric to Datadog
